<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>免費廣告 Banner 製作工具｜可點擊 HTML 嵌入碼</title>
  <meta name="description" content="免費製作固定尺寸的可點擊廣告 Banner。自訂文字、圖片、主色與次色，立即複製 HTML 嵌入碼使用。">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#635bff">
  <link rel="canonical" href="https://ryan112243.github.io/admaker/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:title" content="免費廣告 Banner 製作工具｜可點擊 HTML 嵌入碼">
  <meta property="og:description" content="自訂文字、圖片與色彩，快速產生可直接貼上的廣告 HTML 嵌入碼。">
  <meta property="og:url" content="https://ryan112243.github.io/admaker/">
  <style>
    :root { color-scheme:light; --ink:#172033; --muted:#667085; --line:#e4e7ec; --brand:#635bff; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Microsoft JhengHei",sans-serif; background:radial-gradient(circle at 8% 0%,#e6e4ff 0,transparent 30%),linear-gradient(135deg,#f7f8fc,#eef1f7); }
    button,input,textarea,select { font:inherit; } button { cursor:pointer; }
    .app { width:min(1260px,100%); margin:auto; padding:28px clamp(16px,4vw,40px) 56px; }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:22px; }
    .eyebrow { margin:0 0 8px; color:#5d55d9; font-size:12px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(28px,4vw,46px); line-height:1; letter-spacing:-.055em; }
    .lead { margin:10px 0 0; color:var(--muted); font-size:15px; }
    .badge { color:#443cc7; background:#e8e7ff; border:1px solid #d8d5ff; padding:9px 13px; border-radius:999px; font-size:13px; font-weight:900; white-space:nowrap; }
    .layout { display:grid; grid-template-columns:minmax(280px,360px) minmax(0,1fr); gap:20px; align-items:start; }
    .card { border:1px solid rgba(228,231,236,.9); border-radius:22px; background:rgba(255,255,255,.9); box-shadow:0 18px 45px rgba(16,24,40,.08); backdrop-filter:blur(12px); }
    .panel,.preview-card { padding:22px; }
    .panel h2,.preview-head h2 { margin:0; font-size:17px; letter-spacing:-.02em; }
    .section-label { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:20px 0 11px; color:#344054; font-size:12px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; }
    .field { margin:0 0 13px; } label { display:block; margin-bottom:7px; font-size:13px; font-weight:800; }
    input[type="text"],input[type="url"],input[type="number"],textarea,select { width:100%; border:1px solid #d0d5dd; border-radius:11px; padding:10px 11px; outline:none; background:#fff; color:var(--ink); }
    input:focus,textarea:focus,select:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(99,91,255,.12); }
    textarea { min-height:72px; resize:vertical; } .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .help,.footnote { color:var(--muted); font-size:12px; line-height:1.55; } .help { margin-top:6px; } input[type="file"] { width:100%; font-size:12px; }
    .color-row { display:flex; align-items:center; gap:8px; } input[type="color"] { width:42px; height:38px; padding:3px; border:1px solid #d0d5dd; border-radius:10px; background:white; }
    .switch { display:flex; align-items:center; gap:9px; color:var(--muted); font-size:12px; } .switch input { accent-color:var(--brand); }
    .actions { display:flex; flex-wrap:wrap; gap:9px; margin-top:20px; } .btn { border:0; border-radius:11px; padding:11px 15px; font-weight:900; transition:.15s ease; }
    .btn:hover { transform:translateY(-1px); filter:brightness(.98); } .primary { color:white; background:linear-gradient(135deg,#635bff,#7d72ff); box-shadow:0 8px 18px rgba(99,91,255,.24); } .secondary { color:var(--ink); background:#eef0f5; }
    .preview-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; } #sizeReadout { color:var(--muted); font-size:12px; font-weight:800; }
    .stage { min-height:540px; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:clamp(16px,4vw,34px); border-radius:17px; background:repeating-conic-gradient(#f0f2f6 0 25%,#fbfcfd 0 50%) 50% / 24px 24px; }
    .stage-inner { width:100%; display:flex; justify-content:center; }
    .ad { --ad-w:600; --ad-h:300; --bg:#635bff; --bg-end:#9b8cff; --text:#fff; --ad-pad:20px; --title-size:30px; --subtitle-size:14px; --button-size:13px; position:relative; display:flex; align-items:center; overflow:hidden; width:calc(var(--ad-w) * 1px); max-width:100%; aspect-ratio:var(--ad-w) / var(--ad-h); flex:none; padding:var(--ad-pad); border-radius:14px; color:var(--text); background:linear-gradient(135deg,var(--bg),var(--bg-end)); box-shadow:0 22px 38px rgba(38,31,104,.22); text-decoration:none; }
    .ad::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(120deg,rgba(255,255,255,.22),transparent 38%),radial-gradient(circle at 90% 10%,rgba(255,255,255,.18),transparent 24%); }
    .ad-image { position:absolute; inset:0; width:100%; height:100%; display:none; object-fit:contain; opacity:.84; } .ad-copy { position:relative; z-index:3; width:88%; }
    .ad-title { margin:0 0 .35em; font-size:var(--title-size); line-height:1.05; font-weight:950; letter-spacing:-.045em; white-space:pre-wrap; overflow-wrap:anywhere; }
    .ad-subtitle { margin:0 0 1em; max-width:540px; font-size:var(--subtitle-size); line-height:1.35; white-space:pre-wrap; overflow-wrap:anywhere; } .ad-button { display:inline-block; padding:.65em 1.1em; border-radius:999px; color:#172033; background:rgba(255,255,255,.95); font-size:var(--button-size); font-weight:950; } .ad-button.is-empty { padding:0; background:transparent; opacity:0; }
    .code-card { position:relative; margin-top:18px; overflow:hidden; border:1px solid #303b55; border-radius:14px; background:#182235; }
    .code-head { display:flex; justify-content:space-between; align-items:center; padding:11px 13px; border-bottom:1px solid #303b55; color:#c8d0e2; font-size:12px; font-weight:900; }
    .code-dot { width:8px; height:8px; margin-right:7px; display:inline-block; border-radius:50%; background:#8b7cff; box-shadow:0 0 10px #8b7cff; }
    .code-wrap { position:relative; min-height:180px; }
    #embedCode { margin:0; min-height:180px; max-height:250px; overflow:auto; padding:15px 54px 18px 14px; color:#f0f3fa; font:12px/1.7 Consolas,"Courier New",monospace; white-space:pre-wrap; word-break:break-word; }
    #copyCode { position:absolute; right:12px; bottom:12px; display:grid; place-items:center; width:38px; height:38px; padding:0; border:1px solid rgba(197,207,233,.26); border-radius:10px; color:#f4f6ff; background:rgba(39,51,78,.92); box-shadow:0 8px 20px rgba(0,0,0,.28); transition:.16s ease; }
    #copyCode:hover { border-color:#9a8fff; background:#6659d5; transform:translateY(-1px); } #copyCode svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .footnote { margin:14px 0 0; } @media (max-width:820px) { .layout{grid-template-columns:1fr}.stage{min-height:390px}.panel,.preview-card{padding:18px}header{align-items:flex-start;flex-direction:column}.badge{align-self:flex-start} } @media (max-width:480px) { .app{padding-top:20px}.row{gap:8px}.stage{padding:13px;min-height:300px} }
  </style>
</head>
<body>
  <main class="app">
    <header><div><p class="eyebrow">Banner Lab</p><h1>可點擊廣告製作工具</h1><p class="lead">響應式網頁介面、圖片上傳、裝飾圖案，一次完成可跳轉的 HTML5 Banner。</p></div><div class="badge">免費使用</div></header>
    <section class="layout">
      <aside class="card panel">
        <h2>編輯廣告</h2>
        <div class="section-label">固定尺寸</div>
        <div class="field"><label for="preset">選擇廣告尺寸</label><select id="preset"><option value="300x250" selected>300 × 250</option><option value="468x60">468 × 60</option><option value="728x90">728 × 90</option><option value="320x50">320 × 50</option><option value="320x100">320 × 100</option><option value="120x60">120 × 60</option><option value="125x125">125 × 125</option><option value="200x200">200 × 200</option><option value="240x400">240 × 400</option><option value="250x250">250 × 250</option><option value="336x280">336 × 280</option><option value="120x600">120 × 600</option><option value="160x600">160 × 600</option><option value="300x600">300 × 600</option><option value="970x90">970 × 90</option><option value="970x250">970 × 250</option></select></div>
        <div class="section-label">內容</div>
        <div class="field"><label for="url">點擊後跳轉網址</label><input id="url" type="url" value="https://example.com" placeholder="https://example.com"></div>
        <div class="field"><label for="image">上傳圖片（可選）</label><input id="image" type="file" accept="image/*"><div class="help">圖片會縮放至目前選擇的廣告尺寸並內嵌，不需要另外上傳。</div></div>
        <div class="field"><label for="title">主標題</label><input id="title" type="text" value="讓你的廣告被看見"></div>
        <div class="field"><label for="subtitle">副標題</label><textarea id="subtitle">簡單製作，點擊即可前往你的網站。</textarea></div>
        <div class="field"><label for="button">按鈕文字</label><input id="button" type="text" value="立即了解"></div>
        <div class="section-label">色彩</div>
        <div class="field"><label for="backgroundStyle">背景樣式</label><select id="backgroundStyle"><option value="linear">線性漸層</option><option value="reverse">反向漸層</option><option value="radial">放射漸層</option><option value="solid">單色</option></select></div>
        <div class="row"><div class="field"><label for="bg">主色</label><div class="color-row"><input id="bg" type="color" value="#635bff"><input id="bgText" type="text" value="#635bff"></div></div><div class="field"><label for="bgEnd">次色</label><div class="color-row"><input id="bgEnd" type="color" value="#9b8cff"><input id="bgEndText" type="text" value="#9b8cff"></div></div></div>
        <div class="field"><label for="textColor">文字色</label><div class="color-row"><input id="textColor" type="color" value="#ffffff"><input id="textText" type="text" value="#ffffff"></div></div>
        <div class="actions"><button class="btn secondary" id="reset">重設</button></div>
      </aside>
      <section class="card preview-card">
        <div class="preview-head"><h2>即時預覽</h2><span id="sizeReadout">300 × 250 px</span></div>
        <div class="stage"><div class="stage-inner"><div id="ad" class="ad" style="--ad-w:300;--ad-h:250;--bg:#635bff;--text:#fff" role="link" tabindex="0"><img id="adImage" class="ad-image" alt="廣告圖片"><div class="ad-copy"><h3 id="adTitle" class="ad-title">讓你的廣告被看見</h3><p id="adSubtitle" class="ad-subtitle">簡單製作，點擊即可前往你的網站。</p><span id="adButton" class="ad-button">立即了解</span></div></div></div></div>
        <div class="code-card"><div class="code-head"><span><i class="code-dot"></i>HTML 嵌入代碼</span><span>可直接貼上</span></div><div class="code-wrap"><pre id="embedCode"></pre><button id="copyCode" type="button" aria-label="複製 HTML" title="複製 HTML"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M15 9V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h4"></path></svg></button></div></div>
      </section>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id); let imageData = '', sourceImage = null;
    function safeUrl(value) { try { const u = new URL(value); return ['http:','https:'].includes(u.protocol) ? u.href : '#'; } catch { return '#'; } }
    function esc(value) { return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function getSize() { const [w,h] = $('preset').value.split('x').map(Number); return { w, h }; }
    function getTypography(w,h) { const base=Math.min(w,h), short=h<=120, clamp=(value,min,max)=>Math.max(min,Math.min(max,value)); return { padding:clamp(Math.round(base*(short ? .08 : .09)),8,28), title:clamp(Math.round(base*(short ? .17 : .13)),14,38), subtitle:clamp(Math.round(base*(short ? .1 : .06)),10,16), button:clamp(Math.round(base*(short ? .11 : .055)),10,14) }; }
    function getBackground() { const start=$('bg').value,end=$('bgEnd').value; switch($('backgroundStyle').value) { case 'reverse': return `linear-gradient(315deg, ${start}, ${end})`; case 'radial': return `radial-gradient(circle at 15% 10%, ${start}, ${end})`; case 'solid': return start; default: return `linear-gradient(135deg, ${start}, ${end})`; } }
    function update() { const {w,h}=getSize(),type=getTypography(w,h),emptyButton=!$('button').value.trim(); $('ad').style.setProperty('--ad-w',w);$('ad').style.setProperty('--ad-h',h);$('ad').style.width=`${w}px`;$('ad').style.aspectRatio=`${w} / ${h}`;$('ad').style.setProperty('--ad-pad',`${type.padding}px`);$('ad').style.setProperty('--title-size',`${type.title}px`);$('ad').style.setProperty('--subtitle-size',`${type.subtitle}px`);$('ad').style.setProperty('--button-size',`${type.button}px`);$('ad').style.setProperty('--bg',$('bg').value);$('ad').style.setProperty('--bg-end',$('bgEnd').value);$('ad').style.background=getBackground();$('ad').style.setProperty('--text',$('textColor').value);$('adTitle').textContent=$('title').value;$('adSubtitle').textContent=$('subtitle').value;$('adButton').textContent=$('button').value;$('adButton').classList.toggle('is-empty',emptyButton);$('adImage').style.display=imageData?'block':'none';$('adImage').src=imageData;$('sizeReadout').textContent=`${w} × ${h} px`; if ($('embedCode')) $('embedCode').textContent=buildHtml(); }
    ['url','title','subtitle','button','bg','bgEnd','textColor'].forEach(id => $(id).addEventListener('input', update));
    function resizeImageToBanner() { if (!sourceImage) return; const {w,h}=getSize(),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'),scale=Math.min(w/sourceImage.naturalWidth,h/sourceImage.naturalHeight),drawW=Math.max(1,Math.round(sourceImage.naturalWidth*scale)),drawH=Math.max(1,Math.round(sourceImage.naturalHeight*scale)); canvas.width=w;canvas.height=h;ctx.drawImage(sourceImage,Math.round((w-drawW)/2),Math.round((h-drawH)/2),drawW,drawH);imageData=canvas.toDataURL('image/png'); }
    $('preset').addEventListener('change', () => { resizeImageToBanner(); update(); }); $('backgroundStyle').addEventListener('change', update);
    function syncColor(colorId,textId) { $(colorId).addEventListener('input',()=>{$(textId).value=$(colorId).value;update()});$(textId).addEventListener('change',()=>{if(/^#[0-9a-f]{6}$/i.test($(textId).value)){$(colorId).value=$(textId).value;update()}}); } syncColor('bg','bgText');syncColor('bgEnd','bgEndText');syncColor('textColor','textText');
    $('image').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{sourceImage=new Image();sourceImage.onload=()=>{resizeImageToBanner();update()};sourceImage.src=reader.result};reader.readAsDataURL(file)});
    $('ad').addEventListener('click',()=>{const target=safeUrl($('url').value);if(target!=='#')window.open(target,'_blank','noopener,noreferrer')}); $('reset').addEventListener('click',()=>location.reload());
    function buildBannerHtml() { const w=Math.max(1,Number($('width').value)||600),h=Math.max(1,Number($('height').value)||300),target=safeUrl($('url').value),bg=$('bg').value,color=$('textColor').value,title=esc($('title').value),subtitle=esc($('subtitle').value),button=esc($('button').value),image=imageData?`<img class="background" src="${imageData}" alt="">`:'' ,decos=[...active].slice(0,6).map(s=>`<span class="deco">${esc(s)}</span>`).join(''); return `<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=${w},height=${h}"><title>HTML5 Banner</title><style>*{box-sizing:border-box}html,body{margin:0;width:${w}px;height:${h}px}a{display:flex;position:relative;overflow:hidden;width:${w}px;height:${h}px;padding:${Math.round(Math.min(w,h)*.09)}px;align-items:center;text-decoration:none;color:${color};background:${bg};font-family:Arial,"Microsoft JhengHei",sans-serif}.background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.84}.copy{position:relative;z-index:3;max-width:88%}.decos{position:absolute;inset:0;z-index:2}.deco{position:absolute;color:rgba(255,255,255,.85);font-size:${Math.max(16,Math.round(Math.min(w,h)*.1))}px}.deco:nth-child(1){top:8%;right:9%}.deco:nth-child(2){bottom:10%;right:18%}.deco:nth-child(3){top:24%;right:4%}.deco:nth-child(4){bottom:12%;left:8%}h1{margin:0 0 10px;font-size:${Math.max(18,Math.round(Math.min(w,h)*.12))}px;line-height:1.08}p{margin:0 0 18px;font-size:${Math.max(12,Math.round(Math.min(w,h)*.055))}px;line-height:1.45}.button{display:inline-block;padding:9px 15px;border-radius:999px;background:rgba(255,255,255,.94);color:#172033;font-size:13px;font-weight:700}</style></head><body><a href="${esc(target)}" target="_blank" rel="noopener noreferrer">${image}<div class="decos">${decos}</div><div class="copy"><h1>${title}</h1><p>${subtitle}</p><span class="button">${button}</span></div></a></body></html>`; }
    function buildHtml() { const {w,h}=getSize(),type=getTypography(w,h),target=esc(safeUrl($('url').value)),background=getBackground(),color=$('textColor').value,title=esc($('title').value),subtitle=esc($('subtitle').value),button=esc($('button').value),buttonStyle=button?`display:inline-block;padding:.65em 1.1em;border-radius:999px;background:rgba(255,255,255,.94);color:#172033;font-size:${type.button}px;font-weight:700;`:`display:inline-block;padding:0;background:transparent;color:transparent;font-size:${type.button}px;`,image=imageData?`<img src="${imageData}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.84;">`:''; return `<!-- BEGIN BANNER EMBED -->\n<a href="${target}" target="_blank" rel="noopener noreferrer" style="position:relative;display:flex;align-items:center;overflow:hidden;width:${w}px;height:${h}px;padding:${type.padding}px;color:${color};background:${background};font-family:Arial,Microsoft JhengHei,sans-serif;text-decoration:none;box-sizing:border-box;">\n  ${image}\n  <div style="position:relative;z-index:1;max-width:88%;">\n    <div style="margin:0 0 .35em;font-size:${type.title}px;font-weight:700;line-height:1.08;overflow-wrap:anywhere;">${title}</div>\n    <div style="margin:0 0 1em;font-size:${type.subtitle}px;line-height:1.35;overflow-wrap:anywhere;">${subtitle}</div>\n    <span style="${buttonStyle}">${button}</span>\n  </div>\n</a>\n<!-- END BANNER EMBED -->`; }
    async function copyCode() { const html=buildHtml(); try { await navigator.clipboard.writeText(html); } catch { const area=document.createElement('textarea'); area.value=html; document.body.appendChild(area); area.select(); document.execCommand('copy'); area.remove(); } $('copyCode').textContent='✓'; setTimeout(()=>{$('copyCode').innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M15 9V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h4"></path></svg>'},1800); }
    $('copyCode').addEventListener('click',copyCode);
    function updateCode() { $('embedCode').textContent=buildHtml(); }
    update(); updateCode();
  </script>
</body>
</html>
